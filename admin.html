<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Baan Café</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f9f8f6;--white:#fff;--border:#ede9e3;--text:#18120a;--muted:#9e8f82;--brand:#2d6a4f;--brand-light:#e8f4ee;--red:#dc2626;--red-bg:#fef2f2;}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{font-family:'Noto Serif Thai',serif;font-size:1.15rem;color:var(--brand);}
.badge{background:var(--brand-light);color:var(--brand);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid #b7dfc9;}
.add-btn-hdr{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-family:'Noto Sans Thai',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;}
.import-btn-hdr{background:var(--bg);color:var(--brand);border:1.5px solid #b7dfc9;border-radius:10px;padding:8px 16px;font-family:'Noto Sans Thai',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;}
.hdr-btns{display:flex;gap:8px;}

/* IMPORT MODAL */
.import-modal{background:var(--white);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;}
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);}
.drop-zone.drag{border-color:var(--brand);background:var(--brand-light);}
.drop-zone:hover{border-color:var(--brand);}
.drop-icon{font-size:2.4rem;margin-bottom:10px;}
.drop-txt{font-size:.88rem;color:var(--muted);}
.drop-txt strong{color:var(--brand);}
.drop-sub{font-size:.72rem;color:var(--muted);margin-top:6px;}
.template-btn{background:none;border:none;color:var(--brand);font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;text-decoration:underline;cursor:pointer;margin-top:10px;}

/* PREVIEW TABLE */
.preview-wrap{margin-top:16px;}
.preview-title{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.preview-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.preview-table th{background:var(--bg);padding:8px 10px;text-align:left;border-bottom:1.5px solid var(--border);font-weight:600;color:var(--muted);}
.preview-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);}
.preview-table tr:last-child td{border:none;}
.row-ok{color:var(--brand);}
.row-err{color:var(--red);}
.import-actions{display:flex;gap:8px;margin-top:16px;}
.import-count{font-size:.8rem;color:var(--muted);margin-top:10px;text-align:center;}

.wrap{padding:20px 22px;}
.section-title{font-family:'Noto Serif Thai',serif;font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.menu-list{display:flex;flex-direction:column;gap:10px;}
.menu-item{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.menu-item.sold{opacity:.5;}
.item-img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;}
.item-info{flex:1;}
.item-name{font-size:.92rem;font-weight:600;}
.item-cat{font-size:.68rem;color:var(--muted);margin-top:1px;}
.item-price{font-size:.82rem;font-weight:700;color:var(--brand);margin-top:3px;}
.item-opts{font-size:.68rem;color:var(--muted);margin-top:2px;}
.item-actions{display:flex;gap:6px;flex-shrink:0;}
.i-btn{border:none;border-radius:8px;padding:6px 12px;font-family:'Noto Sans Thai',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;}
.i-edit{background:var(--brand-light);color:var(--brand);}
.i-del{background:var(--red-bg);color:var(--red);}
.i-toggle{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px);}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;}
.modal-title{font-family:'Noto Serif Thai',serif;font-size:1.1rem;font-weight:700;margin-bottom:18px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;}
.form-input:focus{border-color:var(--brand);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
select.form-input{cursor:pointer;}

/* OPTIONS BUILDER */
.opts-section{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-top:4px;}
.opt-group-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.opt-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.opt-group-name{font-size:.85rem;font-weight:600;}
.del-group{background:none;border:none;color:var(--red);font-size:.8rem;cursor:pointer;}
.opt-chips-edit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.opt-chip-edit{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.75rem;display:flex;align-items:center;gap:5px;}
.del-chip{background:none;border:none;color:var(--red);cursor:pointer;font-size:.8rem;line-height:1;}
.add-choice-row{display:flex;gap:6px;}
.choice-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-family:'Noto Sans Thai',sans-serif;font-size:.8rem;background:var(--white);outline:none;}
.choice-input:focus{border-color:var(--brand);}
.add-choice-btn{background:var(--brand-light);color:var(--brand);border:1px solid #b7dfc9;border-radius:8px;padding:7px 12px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.add-group-btn{background:none;border:1.5px dashed var(--border);border-radius:10px;width:100%;padding:10px;color:var(--muted);font-family:'Noto Sans Thai',sans-serif;font-size:.82rem;cursor:pointer;margin-top:4px;}
.add-group-btn:hover{border-color:var(--brand);color:var(--brand);}

.modal-actions{display:flex;gap:8px;margin-top:18px;}
.m-cancel{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;cursor:pointer;}
.m-save{flex:2;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:12px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 24px;border-radius:20px;font-size:.85rem;font-weight:600;transition:transform .3s;z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.loading{text-align:center;padding:40px;color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="brand">Baan Café</div>
    <div class="badge">⚙️ Admin</div>
  </div>
  <div class="hdr-btns">
    <button class="import-btn-hdr" onclick="openImport()">📥 Import CSV</button>
    <button class="add-btn-hdr" onclick="openAddModal()">+ เพิ่มเมนู</button>
  </div>
</div>

<!-- IMPORT MODAL -->
<div class="overlay" id="importOverlay">
  <div class="import-modal">
    <div class="modal-title">📥 Import เมนูจาก CSV</div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvFile').click()">
      <div class="drop-icon">📄</div>
      <div class="drop-txt">คลิกหรือลากไฟล์ <strong>CSV / Excel</strong> มาวางได้เลย</div>
      <div class="drop-sub">รองรับ .csv และ .xlsx</div>
      <button class="template-btn" onclick="event.stopPropagation();downloadTemplate()">⬇️ โหลด template CSV</button>
    </div>
    <input type="file" id="csvFile" accept=".csv,.xlsx" style="display:none" onchange="handleFile(this.files[0])">

    <div id="previewWrap" style="display:none">
      <div class="preview-wrap">
        <div class="preview-title">ตรวจสอบข้อมูลก่อน import</div>
        <div style="overflow-x:auto;">
          <table class="preview-table">
            <thead><tr><th>#</th><th>ชื่อ</th><th>ราคา</th><th>หมวดหมู่</th><th>คำอธิบาย</th><th>สถานะ</th></tr></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
        <div class="import-count" id="importCount"></div>
      </div>
      <div class="import-actions">
        <button class="m-cancel" onclick="resetImport()">ยกเลิก</button>
        <button class="m-save" id="importConfirmBtn" onclick="confirmImport()">✓ Import เมนูทั้งหมด</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="section-title">เมนูทั้งหมด</div>
  <div class="menu-list" id="menuList"><div class="loading">กำลังโหลด...</div></div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">เพิ่มเมนู</div>
    <div class="form-group">
      <label class="form-label">ชื่อเมนู</label>
      <input class="form-input" id="f-name" placeholder="Americano">
    </div>
    <div class="form-group">
      <label class="form-label">คำอธิบาย</label>
      <input class="form-input" id="f-desc" placeholder="กาแฟดำ เข้มกำลังดี">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">ราคา (฿)</label>
        <input class="form-input" id="f-price" type="number" placeholder="55">
      </div>
      <div class="form-group">
        <label class="form-label">หมวดหมู่</label>
        <select class="form-input" id="f-cat">
          <option value="coffee">☕ กาแฟ</option>
          <option value="tea">🍵 ชา</option>
          <option value="smoothie">🥤 สมูทตี้</option>
          <option value="food">🍽️ อาหาร</option>
          <option value="dessert">🍰 ของหวาน</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">URL รูปภาพ (ถ้ามี)</label>
      <input class="form-input" id="f-image" placeholder="https://...">
    </div>

    <!-- OPTIONS BUILDER -->
    <div class="form-group">
      <label class="form-label">ตัวเลือกสินค้า</label>
      <div class="opts-section">
        <div id="optGroups"></div>
        <button class="add-group-btn" onclick="addOptGroup()">+ เพิ่มกลุ่มตัวเลือก</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="m-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="m-save" onclick="saveItem()">บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAesuRNgMufCal21ejdMIEl6hMi60N2gZs",
  authDomain: "baan-cafe.firebaseapp.com",
  databaseURL: "https://baan-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baan-cafe", storageBucket: "baan-cafe.firebasestorage.app",
  messagingSenderId: "599832482819", appId: "1:599832482819:web:ef0e1c19c109c0b7ad2a36"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const catLabel = {coffee:'☕ กาแฟ',tea:'🍵 ชา',smoothie:'🥤 สมูทตี้',food:'🍽️ อาหาร',dessert:'🍰 ของหวาน'};
const catEmoji = {coffee:'☕',tea:'🍵',smoothie:'🥤',food:'🍽️',dessert:'🍰'};

let menuData = {};
let editId = null;
let optGroups = []; // [{label, required, choices:[{label,extra}]}]

onValue(ref(db,'menu'), snap=>{
  menuData = snap.val()||{};
  renderMenuList();
});

function renderMenuList(){
  const list = document.getElementById('menuList');
  const items = Object.entries(menuData);
  if(!items.length){ list.innerHTML='<div class="empty">ยังไม่มีเมนู กด "+ เพิ่มเมนู" ได้เลยครับ</div>'; return; }
  list.innerHTML = items.map(([id,item])=>{
    const opts = item.options ? Object.values(item.options).map(g=>g.label).join(', ') : '';
    const img = item.image
      ? `<img class="item-img" src="${item.image}" onerror="this.style.background='var(--brand-light)';this.textContent='${catEmoji[item.category]||'🍽️'}';">`
      : `<div class="item-img">${catEmoji[item.category]||'🍽️'}</div>`;
    return `<div class="menu-item${item.soldOut?' sold':''}">
      ${img}
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-cat">${catLabel[item.category]||item.category||''}</div>
        <div class="item-price">฿${item.price}</div>
        ${opts?`<div class="item-opts">ตัวเลือก: ${opts}</div>`:''}
      </div>
      <div class="item-actions">
        <button class="i-btn i-toggle" onclick="toggleSold('${id}',${!!item.soldOut})">${item.soldOut?'เปิดขาย':'หยุดขาย'}</button>
        <button class="i-btn i-edit" onclick="openEdit('${id}')">✏️</button>
        <button class="i-btn i-del" onclick="deleteItem('${id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

window.openAddModal = function(){
  editId=null;
  optGroups=[];
  document.getElementById('modalTitle').textContent='เพิ่มเมนู';
  document.getElementById('f-name').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-price').value='';
  document.getElementById('f-cat').value='coffee';
  document.getElementById('f-image').value='';
  renderOptGroups();
  document.getElementById('editOverlay').classList.add('open');
};

window.openEdit = function(id){
  editId=id;
  const item=menuData[id];
  document.getElementById('modalTitle').textContent='แก้ไขเมนู';
  document.getElementById('f-name').value=item.name||'';
  document.getElementById('f-desc').value=item.desc||'';
  document.getElementById('f-price').value=item.price||'';
  document.getElementById('f-cat').value=item.category||'coffee';
  document.getElementById('f-image').value=item.image||'';
  // load options
  optGroups = item.options ? Object.entries(item.options).map(([k,g])=>({
    key:k, label:g.label||k, required:g.required||false,
    choices: g.choices ? Object.entries(g.choices).map(([ck,c])=>({
      key:ck, label:typeof c==='object'?c.label:c, extra:typeof c==='object'?c.extra||0:0
    })) : []
  })) : [];
  renderOptGroups();
  document.getElementById('editOverlay').classList.add('open');
};

window.closeModal = function(){
  document.getElementById('editOverlay').classList.remove('open');
};

window.addOptGroup = function(){
  optGroups.push({label:'',required:false,choices:[]});
  renderOptGroups();
};

window.deleteOptGroup = function(i){
  optGroups.splice(i,1);
  renderOptGroups();
};

window.addChoice = function(gi){
  const labelInput = document.getElementById(`ci-label-${gi}`);
  const extraInput = document.getElementById(`ci-extra-${gi}`);
  const label = labelInput.value.trim();
  if(!label) return;
  optGroups[gi].choices.push({label, extra: parseInt(extraInput.value)||0});
  labelInput.value=''; extraInput.value='';
  renderOptGroups();
};

window.deleteChoice = function(gi,ci){
  optGroups[gi].choices.splice(ci,1);
  renderOptGroups();
};

function renderOptGroups(){
  const wrap = document.getElementById('optGroups');
  wrap.innerHTML = optGroups.map((g,gi)=>`
    <div class="opt-group-item">
      <div class="opt-group-head">
        <input class="choice-input" style="font-weight:600;" value="${g.label}" placeholder="ชื่อกลุ่ม เช่น ความหวาน" oninput="optGroups[${gi}].label=this.value">
        <button class="del-group" onclick="deleteOptGroup(${gi})">ลบ</button>
      </div>
      <div class="opt-chips-edit">
        ${g.choices.map((c,ci)=>`
          <div class="opt-chip-edit">${c.label}${c.extra?` +${c.extra}`:''}
            <button class="del-chip" onclick="deleteChoice(${gi},${ci})">✕</button>
          </div>`).join('')}
      </div>
      <div class="add-choice-row">
        <input class="choice-input" id="ci-label-${gi}" placeholder="ชื่อตัวเลือก เช่น หวานน้อย">
        <input class="choice-input" id="ci-extra-${gi}" type="number" placeholder="+฿" style="width:64px;">
        <button class="add-choice-btn" onclick="addChoice(${gi})">+ เพิ่ม</button>
      </div>
    </div>`).join('');
}

window.saveItem = async function(){
  const name=document.getElementById('f-name').value.trim();
  const price=parseInt(document.getElementById('f-price').value);
  if(!name||isNaN(price)){alert('กรุณากรอกชื่อและราคาครับ');return;}
  const data={
    name, price,
    desc:document.getElementById('f-desc').value.trim(),
    category:document.getElementById('f-cat').value,
    image:document.getElementById('f-image').value.trim(),
    soldOut:editId?menuData[editId]?.soldOut||false:false
  };
  // build options
  if(optGroups.length){
    data.options={};
    optGroups.forEach((g,i)=>{
      const key=g.key||`opt${i}`;
      data.options[key]={label:g.label, required:g.required, choices:{}};
      g.choices.forEach((c,j)=>{
        const ck=c.key||`c${j}`;
        data.options[key].choices[ck]=c.extra?{label:c.label,extra:c.extra}:c.label;
      });
    });
  }
  try{
    if(editId) await update(ref(db,`menu/${editId}`),data);
    else await push(ref(db,'menu'),data);
    closeModal();
    showToast(editId?'แก้ไขเมนูแล้ว ✓':'เพิ่มเมนูแล้ว ✓');
  }catch(e){alert('บันทึกไม่สำเร็จ: '+e.message);}
};

window.deleteItem = async function(id){
  if(!confirm('ลบเมนูนี้ออกใช่ไหมครับ?')) return;
  await remove(ref(db,`menu/${id}`));
  showToast('ลบเมนูแล้ว');
};

window.toggleSold = async function(id, sold){
  await update(ref(db,`menu/${id}`),{soldOut:!sold});
  showToast(!sold?'หยุดขายแล้ว':'เปิดขายแล้ว ✓');
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('editOverlay').addEventListener('click',e=>{
  if(e.target.id==='editOverlay') closeModal();
});
document.getElementById('importOverlay').addEventListener('click',e=>{
  if(e.target.id==='importOverlay') closeImport();
});

// DRAG & DROP
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('drag');
  const f=e.dataTransfer.files[0]; if(f) handleFile(f);
});

let parsedRows = [];

window.openImport = function(){
  resetImport();
  document.getElementById('importOverlay').classList.add('open');
};
window.closeImport = function(){
  document.getElementById('importOverlay').classList.remove('open');
};
window.resetImport = function(){
  parsedRows=[];
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('csvFile').value='';
  dz.classList.remove('drag');
};

window.downloadTemplate = function(){
  const csv = 'name,price,category,desc,image\nAmericano,55,coffee,กาแฟดำเข้มข้น,\nLatte,75,coffee,กาแฟนมสด,\nชาไทย,55,tea,ชาไทยต้นตำรับ,\n';
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='baan-cafe-menu-template.csv'; a.click();
};

window.handleFile = async function(file){
  if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'){
    // load SheetJS
    if(!window.XLSX){
      await new Promise(res=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=res; document.head.appendChild(s);
      });
    }
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const data=XLSX.utils.sheet_to_json(ws,{defval:''});
    parseRows(data);
  } else {
    const text=await file.text();
    const lines=text.split('\n').filter(l=>l.trim());
    const headers=lines[0].split(',').map(h=>h.trim().replace(/^["']|["']$/g,'').toLowerCase());
    const data=lines.slice(1).map(line=>{
      const vals=line.match(/(".*?"|[^,]+)(?=,|$)/g)||line.split(',');
      const obj={};
      headers.forEach((h,i)=>{ obj[h]=(vals[i]||'').trim().replace(/^["']|["']$/g,''); });
      return obj;
    });
    parseRows(data);
  }
};

const validCats=['coffee','tea','smoothie','food','dessert'];
function parseRows(data){
  parsedRows=data.map((r,i)=>{
    const name=r.name||r['ชื่อ']||r['ชื่อเมนู']||'';
    const price=parseFloat(r.price||r['ราคา']||0);
    const category=(r.category||r['หมวดหมู่']||'coffee').toLowerCase().trim();
    const desc=r.desc||r['คำอธิบาย']||r.description||'';
    const image=r.image||r['รูปภาพ']||'';
    const valid=!!name && !isNaN(price) && price>0 && validCats.includes(category);
    return {name,price,category,desc,image,valid};
  }).filter(r=>r.name);

  const ok=parsedRows.filter(r=>r.valid).length;
  const err=parsedRows.length-ok;
  document.getElementById('previewBody').innerHTML=parsedRows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.name}</td>
      <td>฿${r.price}</td>
      <td>${r.category}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.desc}</td>
      <td class="${r.valid?'row-ok':'row-err'}">${r.valid?'✓ ดี':'✗ ข้อมูลไม่ครบ'}</td>
    </tr>`).join('');
  document.getElementById('importCount').textContent=
    `พร้อม import ${ok} รายการ${err?` · ข้ามที่มีปัญหา ${err} รายการ`:''}`;
  document.getElementById('importConfirmBtn').textContent=`✓ Import ${ok} เมนู`;
  document.getElementById('previewWrap').style.display='block';
}

window.confirmImport = async function(){
  const btn=document.getElementById('importConfirmBtn');
  const toImport=parsedRows.filter(r=>r.valid);
  if(!toImport.length){alert('ไม่มีรายการที่พร้อม import ครับ');return;}
  btn.textContent='กำลัง import...';btn.disabled=true;
  try{
    for(const r of toImport){
      await push(ref(db,'menu'),{
        name:r.name, price:r.price,
        category:r.category, desc:r.desc,
        image:r.image, soldOut:false
      });
    }
    closeImport();
    showToast(`Import ${toImport.length} เมนูเรียบร้อยแล้ว ✓`);
  }catch(e){
    alert('Import ไม่สำเร็จ: '+e.message);
    btn.textContent=`✓ Import ${toImport.length} เมนู`;
    btn.disabled=false;
  }
};
</script>
