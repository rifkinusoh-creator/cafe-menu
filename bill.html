<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คบิล — Baan Café</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f9f8f6;--white:#fff;--border:#ede9e3;--text:#18120a;--muted:#9e8f82;--brand:#2d6a4f;--brand-light:#e8f4ee;--green:#16a34a;--green-bg:#f0fdf4;}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'Noto Serif Thai',serif;font-size:1.2rem;font-weight:700;color:var(--brand);}
.sub{font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:7px 16px;font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;cursor:pointer;display:none;}

.sel-wrap{padding:24px 22px;}
.sel-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:22px;}
.sel-title{font-family:'Noto Serif Thai',serif;font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.sel-sub{font-size:.78rem;color:var(--muted);margin-bottom:18px;}
.tbl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.tbl-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:13px 8px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;}
.tbl-btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.open-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Noto Sans Thai',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;}
.open-btn:disabled{opacity:.4;cursor:not-allowed;}

.bill-wrap{padding:22px;display:none;}
.bill-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;max-width:460px;margin:0 auto;}
.b-head{padding:22px;text-align:center;border-bottom:1px solid var(--border);}
.b-cafe{font-family:'Noto Serif Thai',serif;font-size:1.35rem;font-weight:700;color:var(--brand);}
.b-tbl{display:inline-block;background:var(--brand-light);color:var(--brand);font-weight:700;font-size:.8rem;border:1px solid #b7dfc9;border-radius:20px;padding:4px 16px;margin:8px 0 4px;}
.b-date{font-size:.7rem;color:var(--muted);}
.b-orders{padding:0 22px;}
.round{margin:14px 0;}
.round-lbl{font-size:.6rem;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.round-lbl::after{content:'';flex:1;height:1px;background:var(--border);}
.item-row{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);}
.item-row:last-child{border:none;}
.item-name{font-size:.85rem;flex:1;padding-right:8px;line-height:1.4;}
.item-price{font-size:.85rem;font-weight:600;white-space:nowrap;}
.b-summary{margin:0 22px;border-top:1.5px solid var(--border);padding:14px 0;}
.sum-row{display:flex;justify-content:space-between;font-size:.83rem;color:var(--muted);padding:3px 0;}
.sum-total{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700;padding-top:10px;border-top:1px solid var(--border);margin-top:8px;}
.sum-total span:last-child{color:var(--brand);}
.b-actions{padding:14px 22px 22px;display:flex;gap:10px;}
.act-btn{flex:1;border:none;border-radius:14px;padding:13px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;}
.btn-paid{background:var(--green);color:#fff;}
.btn-print{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.paid-screen{display:none;flex-direction:column;align-items:center;padding:44px 22px;text-align:center;gap:10px;}
.paid-icon{font-size:2.8rem;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.paid-h{font-family:'Noto Serif Thai',serif;font-size:1.3rem;font-weight:700;color:var(--brand);}
.paid-amt{font-size:1.8rem;font-weight:700;color:var(--green);}
.paid-sub{font-size:.78rem;color:var(--muted);line-height:1.7;}
.no-orders{text-align:center;padding:36px 22px;color:var(--muted);}
.loading{text-align:center;padding:40px;color:var(--muted);}
@media print{.hdr,.sel-wrap,.b-actions,.back-btn{display:none!important;}body{background:white;}.bill-wrap{padding:0;display:block!important;}.bill-card{border:none;border-radius:0;}}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="brand">Baan Café</div><div class="sub">Bill</div></div>
  <button class="back-btn" id="backBtn" onclick="showSelector()">← เลือกโต๊ะใหม่</button>
</div>

<div class="sel-wrap" id="selWrap">
  <div class="sel-card">
    <div class="sel-title">เช็คบิล</div>
    <div class="sel-sub">เลือกโต๊ะที่ต้องการออกบิลครับ</div>
    <div class="tbl-grid" id="tblGrid"></div>
    <button class="open-btn" id="openBtn" onclick="openBill()" disabled>เปิดบิล →</button>
  </div>
</div>

<div class="bill-wrap" id="billWrap">
  <div class="bill-card">
    <div class="b-head">
      <div class="b-cafe">Baan Café</div>
      <div class="b-tbl" id="bTable"></div>
      <div class="b-date" id="bDate"></div>
    </div>
    <div id="billBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAesuRNgMufCal21ejdMIEl6hMi60N2gZs",
  authDomain: "baan-cafe.firebaseapp.com",
  databaseURL: "https://baan-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baan-cafe", storageBucket: "baan-cafe.firebasestorage.app",
  messagingSenderId: "599832482819", appId: "1:599832482819:web:ef0e1c19c109c0b7ad2a36"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let selectedTable = null;
let allOrders = {};

// build table buttons
for(let i=1;i<=8;i++){
  const btn=document.createElement('button');
  btn.className='tbl-btn'; btn.textContent=`โต๊ะ ${i}`;
  btn.onclick=function(){
    selectedTable=i;
    document.querySelectorAll('.tbl-btn').forEach(b=>b.classList.remove('on'));
    this.classList.add('on');
    document.getElementById('openBtn').disabled=false;
  };
  document.getElementById('tblGrid').appendChild(btn);
}

// load orders from Firebase
onValue(ref(db,'orders'), snap=>{ allOrders = snap.val()||{}; });

window.openBill = function(){
  if(!selectedTable) return;
  const tNum = String(selectedTable);
  const orders = Object.entries(allOrders)
    .map(([id,v])=>({id,...v}))
    .filter(o=>String(o.table)===tNum && o.status!=='ชำระแล้ว')
    .sort((a,b)=>a.createdAt-b.createdAt);

  document.getElementById('bTable').textContent=`โต๊ะ ${selectedTable}`;
  document.getElementById('bDate').textContent=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'medium',timeStyle:'short'});
  document.getElementById('selWrap').style.display='none';
  document.getElementById('billWrap').style.display='block';
  document.getElementById('backBtn').style.display='block';

  if(!orders.length){
    document.getElementById('billBody').innerHTML='<div class="no-orders">🧾 ไม่พบออเดอร์ที่ยังไม่ชำระ</div>';
    return;
  }

  let grandTotal=0;
  let html='<div class="b-orders">';
  orders.forEach((o,i)=>{
    const items=Array.isArray(o.items)?o.items:[];
    const total=Number(o.total)||0;
    grandTotal+=total;
    const time=o.createdAt?new Date(o.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
    html+=`<div class="round"><div class="round-lbl">รอบที่ ${i+1} · ${time}</div>`;
    items.forEach(it=>{
      html+=`<div class="item-row"><span class="item-name">${it.name}</span><span class="item-price">฿${it.price}</span></div>`;
    });
    html+=`</div>`;
  });
  html+='</div>';

  const vat=Math.round(grandTotal*.07);
  html+=`<div class="b-summary">
    <div class="sum-row"><span>จำนวน ${orders.length} รอบ</span><span>${orders.length} ออเดอร์</span></div>
    <div class="sum-row"><span>ยอดก่อน VAT</span><span>฿${(grandTotal-vat).toLocaleString()}</span></div>
    <div class="sum-row"><span>VAT 7%</span><span>฿${vat.toLocaleString()}</span></div>
    <div class="sum-total"><span>ยอดรวมทั้งหมด</span><span>฿${grandTotal.toLocaleString()}</span></div>
  </div>
  <div class="b-actions">
    <button class="act-btn btn-print" onclick="window.print()">🖨️ พิมพ์</button>
    <button class="act-btn btn-paid" onclick="markPaid(${grandTotal})">✓ ชำระแล้ว</button>
  </div>
  <div class="paid-screen" id="paidScreen">
    <div class="paid-icon">🎉</div>
    <div class="paid-h">ชำระเงินแล้ว</div>
    <div class="paid-amt">฿${grandTotal.toLocaleString()}</div>
    <div class="paid-sub">ขอบคุณที่ใช้บริการครับ<br>แวะมาใหม่นะครับ ☕</div>
    <button class="act-btn" style="background:var(--bg);border:1.5px solid var(--border);" onclick="showSelector()">เช็คบิลโต๊ะอื่น</button>
  </div>`;

  document.getElementById('billBody').innerHTML=html;

  window.markPaid = async function(total){
    const tNum=String(selectedTable);
    const toUpdate=Object.entries(allOrders)
      .filter(([id,o])=>String(o.table)===tNum && o.status!=='ชำระแล้ว');
    for(const [id] of toUpdate){
      await update(ref(db,`orders/${id}`),{status:'ชำระแล้ว'});
    }
    document.querySelector('.b-actions').style.display='none';
    document.getElementById('paidScreen').style.display='flex';
  };
};

window.showSelector = function(){
  selectedTable=null;
  document.querySelectorAll('.tbl-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('openBtn').disabled=true;
  document.getElementById('selWrap').style.display='block';
  document.getElementById('billWrap').style.display='none';
  document.getElementById('backBtn').style.display='none';
};
</script>
</body>
</html>
