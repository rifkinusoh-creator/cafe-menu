<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คบิล — Baan Café</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f5f2;--white:#fff;--border:#e8e4de;--text:#1c1917;
  --sub:#a09589;--accent:#c97941;--accent-bg:#fdf6ee;
  --green:#16a34a;--green-bg:#f0fdf4;--red:#dc2626;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'DM Serif Display',serif;font-size:1.2rem;}
.logo span{color:var(--accent);}
.logo-sub{font-size:0.62rem;color:var(--sub);letter-spacing:0.1em;text-transform:uppercase;}
.back-btn{background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:0.78rem;cursor:pointer;}

/* SELECTOR */
.selector-wrap{padding:28px 24px;}
.selector-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:24px;}
.sel-title{font-family:'DM Serif Display',serif;font-size:1.15rem;margin-bottom:4px;}
.sel-sub{font-size:0.8rem;color:var(--sub);margin-bottom:20px;}
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.table-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:14px 8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.15s;}
.table-btn.active{background:var(--text);border-color:var(--text);color:#fff;}
.open-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;}
.open-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* BILL */
.bill-wrap{padding:24px;display:none;}
.bill-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;max-width:480px;margin:0 auto;}
.bill-head{padding:24px;text-align:center;border-bottom:1px solid var(--border);}
.bill-cafe{font-family:'DM Serif Display',serif;font-size:1.4rem;}
.bill-cafe span{color:var(--accent);}
.bill-table-lbl{display:inline-block;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:0.82rem;border:1px solid #e8c9a0;border-radius:20px;padding:4px 16px;margin:10px 0 4px;}
.bill-date{font-size:0.72rem;color:var(--sub);}
.bill-orders{padding:0 24px;}
.round-wrap{margin:16px 0;}
.round-label{font-size:0.62rem;font-weight:600;color:var(--sub);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.round-label::after{content:'';flex:1;height:1px;background:var(--border);}
.item-row{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);}
.item-row:last-child{border-bottom:none;}
.item-name{font-size:0.88rem;flex:1;}
.item-qty{font-size:0.75rem;color:var(--sub);margin:0 10px;}
.item-price{font-size:0.88rem;font-weight:600;}
.bill-summary{margin:0 24px;border-top:1.5px solid var(--border);padding:16px 0;}
.sum-row{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--sub);padding:4px 0;}
.sum-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;color:var(--text);padding-top:12px;border-top:1px solid var(--border);margin-top:8px;}
.sum-total span:last-child{color:var(--accent);}
.bill-actions{padding:16px 24px 24px;display:flex;gap:10px;}
.act-btn{flex:1;border:none;border-radius:14px;padding:13px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;}
.btn-paid{background:var(--green);color:#fff;}
.btn-print{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.paid-screen{display:none;flex-direction:column;align-items:center;padding:48px 24px;text-align:center;gap:12px;}
.paid-icon{font-size:3rem;animation:pop 0.4s ease;}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.paid-h{font-family:'DM Serif Display',serif;font-size:1.4rem;}
.paid-amt{font-size:2rem;font-weight:700;color:var(--green);}
.paid-sub{font-size:0.8rem;color:var(--sub);line-height:1.7;}
.no-orders{text-align:center;padding:40px 24px;color:var(--sub);}
.loading{text-align:center;padding:40px;color:var(--sub);}
@media print{.header,.selector-wrap,.bill-actions,.back-btn{display:none!important;}body{background:white;}.bill-wrap{padding:0;display:block!important;}.bill-card{border:none;}}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">Baan <span>Café</span></div>
    <div class="logo-sub">Bill</div>
  </div>
  <button class="back-btn" id="backBtn" style="display:none" onclick="showSelector()">← เลือกโต๊ะใหม่</button>
</div>

<div class="selector-wrap" id="selectorWrap">
  <div class="selector-card">
    <div class="sel-title">เช็คบิล</div>
    <div class="sel-sub">เลือกโต๊ะที่ต้องการออกบิลครับ</div>
    <div class="table-grid" id="tableGrid"></div>
    <button class="open-btn" id="openBtn" onclick="openBill()" disabled>เปิดบิล →</button>
  </div>
</div>

<div class="bill-wrap" id="billWrap">
  <div class="bill-card">
    <div class="bill-head">
      <div class="bill-cafe">Baan <span>Café</span></div>
      <div class="bill-table-lbl" id="billTableLbl"></div>
      <div class="bill-date" id="billDate"></div>
    </div>
    <div id="billBody"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5I8XbCwxc9rnjF1kN5VclevV0tWOzluMDf8jJaz2omneEOa3zH6sXRc-51pmHugQZ/exec';
let selectedTable = null;
let allOrders = [];
let grandTotal = 0;

// สร้างปุ่มโต๊ะ
for (let i = 1; i <= 8; i++) {
  const btn = document.createElement('button');
  btn.className = 'table-btn';
  btn.textContent = 'โต๊ะ ' + i;
  btn.dataset.num = i;
  btn.onclick = function() {
    selectedTable = i;
    document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('openBtn').disabled = false;
  };
  document.getElementById('tableGrid').appendChild(btn);
}

function openBill() {
  const btn = document.getElementById('openBtn');
  btn.textContent = 'กำลังโหลด...';
  btn.disabled = true;

  window._cb = function(data) {
    allOrders = Array.isArray(data) ? data : [];
    renderBill();
    btn.textContent = 'เปิดบิล →';
    btn.disabled = false;
  };

  const old = document.getElementById('_s');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = '_s';
  s.src = SCRIPT_URL + '?type=orders&callback=_cb&t=' + Date.now();
  s.onerror = function() {
    alert('โหลดไม่สำเร็จ กรุณาลองใหม่');
    btn.textContent = 'เปิดบิล →';
    btn.disabled = false;
  };
  document.body.appendChild(s);
}

function renderBill() {
  // กรองด้วยเลขโต๊ะ ไม่สนใจ encoding ภาษาไทย
  const num = String(selectedTable);
  const orders = allOrders.filter(function(o) {
    var t = String(o.table || '');
    var s = String(o.status || '');
    // เอาเฉพาะตัวเลขออกจาก table field แล้วเปรียบเทียบ
    var tableNum = t.replace(/[^0-9]/g, '');
    return tableNum === num && s !== 'ชำระแล้ว';
  }).reverse();

  const realTableName = orders.length > 0 ? orders[0].table : ('โต๊ะ ' + selectedTable);
  document.getElementById('billTableLbl').textContent = realTableName;
  document.getElementById('billDate').textContent = new Date().toLocaleString('th-TH', {
    timeZone: 'Asia/Bangkok', dateStyle: 'medium', timeStyle: 'short'
  });

  document.getElementById('selectorWrap').style.display = 'none';
  document.getElementById('billWrap').style.display = 'block';
  document.getElementById('backBtn').style.display = 'block';

  if (!orders.length) {
    document.getElementById('billBody').innerHTML = '<div class="no-orders">🧾 ไม่พบออเดอร์ของโต๊ะนี้</div>';
    return;
  }

  grandTotal = 0;
  let html = '<div class="bill-orders">';
  orders.forEach(function(order, i) {
    var items = String(order.items || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var total = parseInt(String(order.total || '0').replace(/[^0-9]/g, '')) || 0;
    grandTotal += total;
    var time = '';
    try {
      var d = new Date(order.timestamp);
      if (!isNaN(d)) time = d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
      else time = String(order.timestamp || '');
    } catch(e) { time = String(order.timestamp || ''); }

    html += '<div class="round-wrap"><div class="round-label">รอบที่ ' + (i+1) + ' · ' + time + '</div>';
    items.forEach(function(item) {
      var m = item.match(/^(.+)\s+x(\d+)$/);
      var name = m ? m[1].trim() : item;
      var qty = m ? m[2] : '1';
      html += '<div class="item-row"><span class="item-name">' + name + '</span><span class="item-qty">×' + qty + '</span><span class="item-price"></span></div>';
    });
    html += '<div style="text-align:right;font-size:0.8rem;color:var(--sub);padding:6px 0;">รวมรอบนี้ ' + order.total + '</div>';
    html += '</div>';
  });
  html += '</div>';

  var vat = Math.round(grandTotal * 0.07);
  var beforeVat = grandTotal - vat;
  html += '<div class="bill-summary">';
  html += '<div class="sum-row"><span>จำนวน ' + orders.length + ' รอบ</span><span>' + orders.length + ' ออเดอร์</span></div>';
  html += '<div class="sum-row"><span>ยอดก่อน VAT</span><span>฿' + beforeVat.toLocaleString() + '</span></div>';
  html += '<div class="sum-row"><span>VAT 7%</span><span>฿' + vat.toLocaleString() + '</span></div>';
  html += '<div class="sum-total"><span>ยอดรวมทั้งหมด</span><span>฿' + grandTotal.toLocaleString() + '</span></div>';
  html += '</div>';
  html += '<div class="bill-actions"><button class="act-btn btn-print" onclick="window.print()">🖨️ พิมพ์</button><button class="act-btn btn-paid" onclick="markPaid()">✓ ชำระแล้ว</button></div>';
  html += '<div class="paid-screen" id="paidScreen"><div class="paid-icon">🎉</div><div class="paid-h">ชำระเงินแล้ว</div><div class="paid-amt">฿' + grandTotal.toLocaleString() + '</div><div class="paid-sub">ขอบคุณที่ใช้บริการครับ<br>แวะมาใหม่นะครับ ☕</div><button class="act-btn" style="background:var(--bg);border:1.5px solid var(--border);color:var(--text);margin-top:8px;" onclick="showSelector()">เช็คบิลโต๊ะอื่น</button></div>';

  document.getElementById('billBody').innerHTML = html;
}

function markPaid() {
  var num = String(selectedTable);
  var toUpdate = allOrders.filter(function(o) {
    var t = String(o.table || '');
    var s = String(o.status || '');
    var tableNum = t.replace(/[^0-9]/g, '');
    return tableNum === num && s !== 'ชำระแล้ว';
  });

  toUpdate.forEach(function(order) {
    var s = document.createElement('script');
    s.src = SCRIPT_URL + '?action=updateStatus&rowIndex=' + order.rowIndex + '&status=' + encodeURIComponent('ชำระแล้ว') + '&callback=_noop&t=' + Date.now();
    document.body.appendChild(s);
  });
  window._noop = function(){};

  var actions = document.querySelector('.bill-actions');
  if (actions) actions.style.display = 'none';
  var paid = document.getElementById('paidScreen');
  if (paid) paid.style.display = 'flex';
}

function showSelector() {
  selectedTable = null;
  document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('openBtn').disabled = true;
  document.getElementById('openBtn').textContent = 'เปิดบิล →';
  document.getElementById('selectorWrap').style.display = 'block';
  document.getElementById('billWrap').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
}
</script>
</body>
</html>
