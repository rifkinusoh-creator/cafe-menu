<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าครัว — Baan Café</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f9f8f6;--white:#fff;--border:#ede9e3;--text:#18120a;--muted:#9e8f82;
  --brand:#2d6a4f;--brand-light:#e8f4ee;
  --orange:#ea580c;--orange-bg:#fff7ed;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --green:#16a34a;--green-bg:#f0fdf4;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{font-family:'Noto Serif Thai',serif;font-size:1.15rem;color:var(--brand);}
.badge{background:var(--brand-light);color:var(--brand);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid #b7dfc9;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.live{display:flex;align-items:center;gap:5px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.live-txt{font-size:.75rem;color:var(--green);font-weight:600;}
.ref-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:6px 14px;font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;cursor:pointer;}

.stats{display:flex;gap:8px;padding:14px 20px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;}
.stat{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:10px 16px;text-align:center;min-width:88px;flex-shrink:0;}
.stat-n{font-size:1.5rem;font-weight:700;}
.stat-l{font-size:.65rem;color:var(--muted);margin-top:1px;}
.stat.w{border-color:#fed7aa;background:var(--orange-bg);} .stat.w .stat-n{color:var(--orange);}
.stat.c{border-color:#bfdbfe;background:var(--blue-bg);} .stat.c .stat-n{color:var(--blue);}
.stat.d{border-color:#bbf7d0;background:var(--green-bg);} .stat.d .stat-n{color:var(--green);}
.stat.p{border-color:#ddd6fe;background:var(--purple-bg);} .stat.p .stat-n{color:var(--purple);}
.stat.t .stat-n{color:var(--brand);}

.filters{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);overflow-x:auto;}
.f-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:6px 16px;font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;}
.f-btn.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:600;}

.orders{padding:18px 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}

.card{background:var(--white);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;animation:up .25s ease;}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card:hover{box-shadow:0 4px 18px rgba(0,0,0,.07);}
.card.w{border-left:4px solid var(--orange);}
.card.c{border-left:4px solid var(--blue);}
.card.d{border-left:4px solid var(--green);opacity:.65;}
.card.p{border-left:4px solid var(--purple);opacity:.5;}

.c-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 9px;border-bottom:1px solid var(--border);}
.c-table{font-size:.98rem;font-weight:700;}
.c-time{font-size:.68rem;color:var(--muted);margin-top:2px;}
.badge-s{font-size:.65rem;font-weight:600;padding:3px 10px;border-radius:20px;}
.badge-s.w{background:var(--orange-bg);color:var(--orange);border:1px solid #fed7aa;}
.badge-s.c{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe;}
.badge-s.d{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0;}
.badge-s.p{background:var(--purple-bg);color:var(--purple);border:1px solid #ddd6fe;}

.c-items{padding:10px 15px;border-bottom:1px solid var(--border);}
.item-row{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:.85rem;}
.item-dot{color:var(--brand);font-size:.5rem;margin-top:6px;flex-shrink:0;}
.item-txt{flex:1;line-height:1.4;}
.item-price{font-size:.75rem;color:var(--muted);flex-shrink:0;}

.c-foot{padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.c-total{font-size:.92rem;font-weight:700;}
.c-btns{display:flex;gap:6px;}
.a-btn{border:none;border-radius:10px;padding:7px 13px;font-family:'Noto Sans Thai',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
.a-btn:active{transform:scale(.94);}
.a-btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-c{background:var(--blue-bg);color:var(--blue);border:1.5px solid #bfdbfe;}
.btn-d{background:var(--green-bg);color:var(--green);border:1.5px solid #bbf7d0;}
.btn-w{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}

.empty{text-align:center;padding:72px 20px;color:var(--muted);grid-column:1/-1;}
.loading{text-align:center;padding:72px 20px;color:var(--muted);}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 24px;border-radius:20px;font-size:.85rem;font-weight:600;transition:transform .3s;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.toast.show{transform:translateX(-50%) translateY(0);}
.new-alert{position:fixed;top:80px;right:20px;background:var(--orange);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:.88rem;box-shadow:0 4px 20px rgba(234,88,12,.3);transform:translateX(200%);transition:transform .3s;z-index:999;}
.new-alert.show{transform:translateX(0);}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="brand">Baan Café</div>
    <div class="badge">🍳 หน้าครัว</div>
  </div>
  <div class="hdr-right">
    <div class="live"><div class="live-dot"></div><div class="live-txt">Real-time</div></div>
  </div>
</div>

<div class="stats">
  <div class="stat w"><div class="stat-n" id="sw">0</div><div class="stat-l">⏳ รอดำเนินการ</div></div>
  <div class="stat c"><div class="stat-n" id="sc">0</div><div class="stat-l">🔥 กำลังทำ</div></div>
  <div class="stat d"><div class="stat-n" id="sd">0</div><div class="stat-l">✅ เสร็จแล้ว</div></div>
  <div class="stat p"><div class="stat-n" id="sp">0</div><div class="stat-l">💳 ชำระแล้ว</div></div>
  <div class="stat t"><div class="stat-n" id="st">0</div><div class="stat-l">📋 วันนี้</div></div>
</div>

<div class="filters">
  <button class="f-btn on" onclick="setFilter('all',this)">ทั้งหมด</button>
  <button class="f-btn" onclick="setFilter('รอดำเนินการ',this)">⏳ รอดำเนินการ</button>
  <button class="f-btn" onclick="setFilter('กำลังทำ',this)">🔥 กำลังทำ</button>
  <button class="f-btn" onclick="setFilter('เสร็จแล้ว',this)">✅ เสร็จแล้ว</button>
  <button class="f-btn" onclick="setFilter('ชำระแล้ว',this)">💳 ชำระแล้ว</button>
</div>

<div class="orders"><div class="grid" id="grid"><div class="loading"><div class="spin"></div>กำลังโหลด...</div></div></div>

<div class="toast" id="toast"></div>
<div class="new-alert" id="newAlert">🔔 มีออเดอร์ใหม่!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAesuRNgMufCal21ejdMIEl6hMi60N2gZs",
  authDomain: "baan-cafe.firebaseapp.com",
  databaseURL: "https://baan-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baan-cafe", storageBucket: "baan-cafe.firebasestorage.app",
  messagingSenderId: "599832482819", appId: "1:599832482819:web:ef0e1c19c109c0b7ad2a36"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const statusCls = {'รอดำเนินการ':'w','กำลังทำ':'c','เสร็จแล้ว':'d','ชำระแล้ว':'p'};
let allOrders = [];
let currentFilter = 'all';
let isFirst = true;

function isToday(ts){
  if(!ts) return false;
  const d = new Date(ts);
  const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

onValue(ref(db,'orders'), snap => {
  const data = snap.val() || {};
  const prev = allOrders.length;
  allOrders = Object.entries(data)
    .map(([id,v])=>({id,...v}))
    .filter(o=>isToday(o.createdAt))
    .sort((a,b)=>b.createdAt-a.createdAt);

  updateStats();
  renderOrders();
  if(!isFirst && allOrders.length > prev) showNewAlert();
  isFirst = false;
});

function updateStats(){
  document.getElementById('sw').textContent = allOrders.filter(o=>o.status==='รอดำเนินการ').length;
  document.getElementById('sc').textContent = allOrders.filter(o=>o.status==='กำลังทำ').length;
  document.getElementById('sd').textContent = allOrders.filter(o=>o.status==='เสร็จแล้ว').length;
  document.getElementById('sp').textContent = allOrders.filter(o=>o.status==='ชำระแล้ว').length;
  document.getElementById('st').textContent = allOrders.length;
}

window.setFilter = function(f,btn){
  currentFilter = f;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderOrders();
};

function renderOrders(){
  const grid = document.getElementById('grid');
  const list = currentFilter==='all' ? allOrders : allOrders.filter(o=>o.status===currentFilter);
  if(!list.length){
    grid.innerHTML='<div class="empty">🍽️<br>ไม่มีออเดอร์</div>'; return;
  }
  grid.innerHTML = list.map(o=>{
    const cls = statusCls[o.status]||'w';
    const time = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
    const items = Array.isArray(o.items) ? o.items : [];
    const itemsHtml = items.map(it=>`
      <div class="item-row">
        <span class="item-dot">●</span>
        <span class="item-txt">${it.name}</span>
        <span class="item-price">฿${it.price}</span>
      </div>`).join('');

    let btns = '';
    if(o.status==='รอดำเนินการ'){
      btns=`<button class="a-btn btn-c" onclick="updateStatus('${o.id}','กำลังทำ',this)">🔥 เริ่มทำ</button>`;
    } else if(o.status==='กำลังทำ'){
      btns=`<button class="a-btn btn-w" onclick="updateStatus('${o.id}','รอดำเนินการ',this)">↩</button>
            <button class="a-btn btn-d" onclick="updateStatus('${o.id}','เสร็จแล้ว',this)">✅ เสร็จ</button>`;
    } else if(o.status==='เสร็จแล้ว'){
      btns=`<button class="a-btn btn-w" onclick="updateStatus('${o.id}','กำลังทำ',this)">↩ เปิดใหม่</button>`;
    } else {
      btns=`<span style="font-size:.72rem;color:var(--purple);font-weight:600;">💳 ชำระแล้ว</span>`;
    }

    return `<div class="card ${cls}">
      <div class="c-head">
        <div><div class="c-table">🪑 โต๊ะ ${o.table}</div><div class="c-time">⏰ ${time}</div></div>
        <div class="badge-s ${cls}">${o.status}</div>
      </div>
      <div class="c-items">${itemsHtml}</div>
      <div class="c-foot">
        <div class="c-total">฿${o.total}</div>
        <div class="c-btns">${btns}</div>
      </div>
    </div>`;
  }).join('');
}

window.updateStatus = async function(id, status, btn){
  btn.disabled = true;
  try{
    await update(ref(db,`orders/${id}`),{status});
    showToast(`อัปเดตเป็น "${status}" แล้ว ✓`);
  }catch(e){
    showToast('❌ อัปเดตไม่สำเร็จ');
    btn.disabled = false;
  }
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function showNewAlert(){
  const a=document.getElementById('newAlert');
  a.classList.add('show');
  setTimeout(()=>a.classList.remove('show'),3000);
  try{
    const ctx=new AudioContext();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(660,ctx.currentTime+.1);
    g.gain.setValueAtTime(.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);
    o.start();o.stop(ctx.currentTime+.4);
  }catch(e){}
}
</script>
</body>
</html>
