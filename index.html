<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Baan Café</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f9f8f6;--white:#fff;--border:#ede9e3;--text:#18120a;--muted:#9e8f82;
  --brand:#2d6a4f;--brand-light:#e8f4ee;--brand-mid:#52b788;
  --warm:#f4a261;--warm-light:#fef3e8;
  --red:#c0392b;--shadow:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:160px;}

/* HEADER */
.hdr{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:env(safe-area-inset-top,0) 0 0;}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;}
.brand{font-family:'Noto Serif Thai',serif;font-size:1.25rem;font-weight:700;color:var(--brand);letter-spacing:-.01em;}
.table-chip{display:flex;align-items:center;gap:5px;background:var(--brand-light);border:1.5px solid #b7dfc9;border-radius:20px;padding:5px 12px;}
.table-chip .lbl{font-size:.68rem;color:var(--brand);font-weight:600;}
.table-chip .val{font-size:.85rem;font-weight:700;color:var(--text);}
.no-table{background:#fff8e7;border:1.5px solid #fcd34d;border-radius:20px;padding:5px 12px;font-size:.72rem;color:#92400e;font-weight:500;}

/* TABS */
.tabs-wrap{padding:10px 18px 0;overflow-x:auto;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;gap:4px;width:max-content;padding-bottom:10px;}
.tab{background:none;border:1.5px solid var(--border);border-radius:20px;padding:5px 16px;font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}

/* MENU */
.menu{padding:16px 18px 0;}
.cat-label{font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.cat-label::after{content:'';flex:1;height:1px;background:var(--border);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}

.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;transition:box-shadow .18s;}
.card:active{box-shadow:var(--shadow);}
.card.sold{opacity:.45;}
.sold-tag{position:absolute;top:7px;left:7px;background:var(--red);color:#fff;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.card-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.card-ph{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,var(--brand-light),#c9ead9);display:flex;align-items:center;justify-content:center;font-size:2.4rem;}
.card-body{padding:9px 11px 11px;}
.card-name{font-size:.84rem;font-weight:600;line-height:1.3;margin-bottom:2px;}
.card-desc{font-size:.68rem;color:var(--muted);line-height:1.45;margin-bottom:7px;}
.card-foot{display:flex;align-items:center;justify-content:space-between;}
.price{font-size:.94rem;font-weight:700;color:var(--brand);}
.price small{font-size:.6rem;font-weight:400;color:var(--muted);}
.add-btn{width:28px;height:28px;border-radius:8px;border:none;background:var(--brand);color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .14s,transform .1s;flex-shrink:0;}
.add-btn:active{transform:scale(.82);}
.add-btn.in{background:var(--warm);}

/* OPTIONS MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(4px);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--white);border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding:0 18px max(28px,env(safe-area-inset-bottom));}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 18px;}
.modal-img{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:12px;margin-bottom:14px;}
.modal-img-ph{width:100%;aspect-ratio:16/7;background:linear-gradient(135deg,var(--brand-light),#c9ead9);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;margin-bottom:14px;}
.modal-name{font-family:'Noto Serif Thai',serif;font-size:1.15rem;font-weight:700;margin-bottom:3px;}
.modal-desc{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
.modal-price{font-size:1rem;font-weight:700;color:var(--brand);margin-bottom:18px;}

/* OPTIONS */
.opt-group{margin-bottom:18px;}
.opt-title{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.opt-required{background:var(--red);color:#fff;font-size:.6rem;font-weight:700;padding:1px 7px;border-radius:20px;}
.opt-chips{display:flex;flex-wrap:wrap;gap:7px;}
.opt-chip{background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-family:'Noto Sans Thai',sans-serif;font-size:.78rem;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;}
.opt-chip.sel{background:var(--brand);border-color:var(--brand);color:#fff;}
.opt-extra{font-size:.68rem;color:var(--brand);margin-left:4px;}

/* NOTE */
.note-lbl{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.note-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;resize:none;transition:border .15s;}
.note-input:focus{border-color:var(--brand);}
.note-sugs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 18px;}
.note-sug{background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.72rem;cursor:pointer;color:var(--text);transition:all .15s;}
.note-sug:active{background:var(--brand-light);border-color:var(--brand);}

.modal-actions{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:12px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;cursor:pointer;}
.btn-add{flex:2;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:12px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-add:active{opacity:.8;}

/* CART BAR */
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:12px 18px max(20px,env(safe-area-inset-bottom));z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.07);transition:transform .3s;}
.cart-bar.hidden{transform:translateY(110%);}
.cart-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cart-meta{display:flex;align-items:center;gap:8px;}
.cart-badge{background:var(--warm);color:#fff;font-size:.68rem;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cart-lbl{font-size:.75rem;color:var(--muted);}
.cart-price{font-size:1.05rem;font-weight:700;}
.cart-sub{font-size:.65rem;color:var(--muted);text-align:right;}
.cart-cta{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Noto Sans Thai',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
.cart-cta:active{opacity:.8;}

/* CART SHEET */
.ci{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.ci:last-child{border:none;}
.ci-name{font-size:.87rem;font-weight:500;}
.ci-opts{font-size:.7rem;color:var(--brand);margin-top:2px;}
.ci-note{font-size:.7rem;color:var(--warm);margin-top:1px;}
.ci-price{font-size:.75rem;color:var(--muted);margin-top:2px;}
.qty-row{display:flex;align-items:center;gap:7px;flex-shrink:0;margin-left:10px;}
.qty-btn{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);font-size:.9rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;}
.qty-n{font-weight:700;font-size:.9rem;min-width:16px;text-align:center;}
.sheet-foot{margin-top:18px;display:flex;align-items:center;justify-content:space-between;}
.sheet-total-lbl{font-size:.68rem;color:var(--muted);margin-bottom:2px;}
.sheet-total{font-size:1.1rem;font-weight:700;}
.place-btn{background:var(--warm);color:#fff;border:none;border-radius:14px;padding:13px 22px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;}
.empty-cart{text-align:center;padding:28px 0;color:var(--muted);font-size:.85rem;}

/* ORDER HISTORY BTN */
.orders-btn{position:relative;background:var(--brand-light);border:1.5px solid #b7dfc9;border-radius:20px;padding:5px 12px;font-family:'Noto Sans Thai',sans-serif;font-size:.75rem;font-weight:600;color:var(--brand);cursor:pointer;display:none;gap:5px;align-items:center;}
.orders-btn.show{display:flex;}
.orders-badge{background:var(--brand);color:#fff;font-size:.6rem;font-weight:700;min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.hdr-right{display:flex;align-items:center;gap:8px;}

/* ORDER HISTORY MODAL */
.oh-title{font-family:'Noto Serif Thai',serif;font-size:1.05rem;font-weight:700;margin-bottom:4px;}
.oh-sub{font-size:.72rem;color:var(--muted);margin-bottom:16px;}
.oh-order{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.oh-order:last-child{margin-bottom:0;}
.oh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.oh-time{font-size:.72rem;color:var(--muted);}
.oh-status{font-size:.65rem;font-weight:600;padding:2px 9px;border-radius:20px;}
.oh-status.w{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;}
.oh-status.c{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}
.oh-status.d{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.oh-status.p{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe;}
.oh-item{font-size:.8rem;color:var(--text);padding:3px 0;display:flex;justify-content:space-between;}
.oh-item-price{font-size:.75rem;color:var(--muted);}
.oh-total{font-size:.82rem;font-weight:700;color:var(--brand);text-align:right;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
.oh-empty{text-align:center;padding:32px 0;color:var(--muted);font-size:.85rem;}
.oh-loading{text-align:center;padding:24px;color:var(--muted);font-size:.82rem;}

/* SUCCESS */
.success{position:fixed;inset:0;background:var(--white);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .25s;}
.success.show{opacity:1;pointer-events:all;}
.s-icon{font-size:3rem;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.18)}100%{transform:scale(1)}}
.s-h{font-family:'Noto Serif Thai',serif;font-size:1.4rem;font-weight:700;color:var(--brand);}
.s-tbl{background:var(--brand-light);color:var(--brand);font-weight:700;border-radius:20px;padding:5px 20px;font-size:.82rem;border:1px solid #b7dfc9;}
.s-sub{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.8;}
.s-back{margin-top:8px;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:13px 28px;font-family:'Noto Sans Thai',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;}
.state{text-align:center;padding:64px 20px;color:var(--muted);}
.state .ico{font-size:2rem;margin-bottom:12px;}
.state-btn{margin-top:14px;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:10px 22px;font-family:'Noto Sans Thai',sans-serif;font-size:.85rem;cursor:pointer;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <div class="brand">Baan Café</div>
    <div class="hdr-right">
      <button class="orders-btn" id="ordersBtn" onclick="openOrderHistory()">
        🧾 ออเดอร์ของฉัน
        <span class="orders-badge" id="ordersBadge">0</span>
      </button>
      <div id="tableChip"><div class="no-table">⚠ สแกน QR ที่โต๊ะ</div></div>
    </div>
  </div>
  <div class="tabs-wrap">
    <div class="tabs" id="tabs">
      <button class="tab on" onclick="filterCat('all',this)">ทั้งหมด</button>
    </div>
  </div>
</div>

<!-- ORDER HISTORY MODAL -->
<div class="modal-overlay" id="ohModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="oh-title">ออเดอร์ของฉัน</div>
    <div class="oh-sub" id="ohSub"></div>
    <div id="ohBody"><div class="oh-loading">⏳ กำลังโหลด...</div></div>
  </div>
</div>

<div class="menu" id="menu"></div>

<!-- OPTIONS MODAL -->
<div class="modal-overlay" id="optModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="optModalBody"></div>
  </div>
</div>

<!-- CART MODAL -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="font-family:'Noto Serif Thai',serif;font-size:1.05rem;font-weight:700;margin-bottom:14px;">ออเดอร์ของคุณ</div>
    <div id="cartItems"></div>
    <div class="sheet-foot">
      <div><div class="sheet-total-lbl">ยอดรวม</div><div class="sheet-total">฿<span id="sheetTotal">0</span></div></div>
      <button class="place-btn" onclick="placeOrder()">สั่งอาหาร →</button>
    </div>
  </div>
</div>

<!-- CART BAR -->
<div class="cart-bar hidden" id="cartBar">
  <div class="cart-row">
    <div class="cart-meta">
      <div class="cart-badge" id="cartCount">0</div>
      <div class="cart-lbl">รายการ</div>
    </div>
    <div><div class="cart-sub">ยอดรวม</div><div class="cart-price">฿<span id="cartTotal">0</span></div></div>
  </div>
  <button class="cart-cta" onclick="openCart()">ดูออเดอร์และสั่งอาหาร →</button>
</div>

<!-- SUCCESS -->
<div class="success" id="successScreen">
  <div class="s-icon">✅</div>
  <div class="s-h">สั่งแล้วครับ!</div>
  <div class="s-tbl" id="successTable"></div>
  <div class="s-sub">ครัวได้รับออเดอร์แล้ว<br>กรุณารอสักครู่นะครับ ☕</div>
  <button class="s-back" onclick="resetOrder()">กลับหน้าเมนู</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, serverTimestamp, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAesuRNgMufCal21ejdMIEl6hMi60N2gZs",
  authDomain: "baan-cafe.firebaseapp.com",
  databaseURL: "https://baan-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baan-cafe",
  storageBucket: "baan-cafe.firebasestorage.app",
  messagingSenderId: "599832482819",
  appId: "1:599832482819:web:ef0e1c19c109c0b7ad2a36"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const catEmoji = {coffee:'☕',tea:'🍵',smoothie:'🥤',food:'🍽️',dessert:'🍰'};
const catLabel = {coffee:'กาแฟ',tea:'ชา',smoothie:'สมูทตี้',food:'อาหาร',dessert:'ของหวาน'};

let menuData = {};
let cart = []; // array of {item, selectedOptions, note, lineTotal}
let currentCat = 'all';
let pendingItem = null;
let pendingSelections = {};

// Table from QR
const tableNo = new URLSearchParams(location.search).get('table') || '';
if(tableNo){
  document.getElementById('tableChip').innerHTML =
    `<div class="table-chip"><span class="lbl">โต๊ะ</span><span class="val">${tableNo}</span></div>`;
}

// Valid tables from Firebase (null = not configured yet, allow)
let validTables = null;
onValue(ref(db,'settings/tables'), snap=>{
  const v = snap.val();
  validTables = v ? Object.keys(v) : null;
});

// ORDER HISTORY — listen real-time for this table's orders
let tableOrders = [];
const statusCls = {'รอดำเนินการ':'w','กำลังทำ':'c','เสร็จแล้ว':'d','ชำระแล้ว':'p'};
const statusLabel = {'รอดำเนินการ':'⏳ รอดำเนินการ','กำลังทำ':'🔥 กำลังทำ','เสร็จแล้ว':'✅ เสร็จแล้ว','ชำระแล้ว':'💳 ชำระแล้ว'};

if(tableNo){
  onValue(ref(db,'orders'), snap=>{
    const all = snap.val()||{};
    tableOrders = Object.entries(all)
      .map(([id,v])=>({id,...v}))
      .filter(o=>String(o.table)===String(tableNo) && o.status!=='ชำระแล้ว')
      .sort((a,b)=>b.createdAt-a.createdAt);

    // update badge
    const btn = document.getElementById('ordersBtn');
    const badge = document.getElementById('ordersBadge');
    btn.classList.toggle('show', tableOrders.length>0);
    badge.textContent = tableOrders.length;

    // update if modal open
    if(document.getElementById('ohModal').classList.contains('open')){
      renderOrderHistory();
    }
  });
}

window.openOrderHistory = function(){
  renderOrderHistory();
  document.getElementById('ohModal').classList.add('open');
};

function renderOrderHistory(){
  const sub = document.getElementById('ohSub');
  const body = document.getElementById('ohBody');
  sub.textContent = tableNo ? `โต๊ะ ${tableNo} · ${tableOrders.length} ออเดอร์` : '';

  if(!tableOrders.length){
    body.innerHTML='<div class="oh-empty">📋 ยังไม่มีออเดอร์</div>';
    return;
  }

  body.innerHTML = tableOrders.map((o,i)=>{
    const cls = statusCls[o.status]||'w';
    const lbl = statusLabel[o.status]||o.status;
    const time = o.createdAt
      ? new Date(o.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
      : '';
    const items = Array.isArray(o.items)?o.items:[];
    const itemsHtml = items.map(it=>`
      <div class="oh-item">
        <span>${it.name}</span>
        <span class="oh-item-price">฿${it.price}</span>
      </div>`).join('');
    return `
      <div class="oh-order">
        <div class="oh-head">
          <span class="oh-time">รอบที่ ${tableOrders.length-i} · ${time}</span>
          <span class="oh-status ${cls}">${lbl}</span>
        </div>
        ${itemsHtml}
        <div class="oh-total">฿${o.total}</div>
      </div>`;
  }).join('');
}

document.getElementById('ohModal').addEventListener('click',e=>{
  if(e.target.id==='ohModal') document.getElementById('ohModal').classList.remove('open');
});

// Load menu from Firebase
onValue(ref(db,'menu'), snap => {
  menuData = snap.val() || {};
  buildTabs();
  renderMenu();
});

function buildTabs(){
  const cats = [...new Set(Object.values(menuData).map(m=>m.category).filter(Boolean))];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = `<button class="tab on" onclick="filterCat('all',this)">ทั้งหมด</button>`;
  cats.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = (catEmoji[c]||'') + ' ' + (catLabel[c]||c);
    btn.onclick = function(){ filterCat(c,this); };
    tabs.appendChild(btn);
  });
}

window.filterCat = function(cat, btn){
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  renderMenu();
};

function renderMenu(){
  const wrap = document.getElementById('menu');
  const items = Object.entries(menuData).map(([id,v])=>({id,...v}))
    .filter(m => currentCat==='all' || m.category===currentCat);
  const cats = currentCat==='all'
    ? [...new Set(items.map(m=>m.category).filter(Boolean))]
    : [currentCat];

  let html = '';
  cats.forEach(cat=>{
    const ci = items.filter(m=>m.category===cat);
    if(!ci.length) return;
    html += `<div class="cat-label">${catLabel[cat]||cat}</div><div class="grid">`;
    ci.forEach(item=>{
      const inCart = cart.some(c=>c.item.id===item.id);
      const img = item.image
        ? `<img class="card-img" src="${item.image}" onerror="this.outerHTML='<div class=\\'card-ph\\'>${catEmoji[item.category]||'🍽️'}</div>'">`
        : `<div class="card-ph">${catEmoji[item.category]||'🍽️'}</div>`;
      html += `<div class="card${item.soldOut?' sold':''}">
        ${item.soldOut?'<div class="sold-tag">หมด</div>':''}
        ${img}
        <div class="card-body">
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc||''}</div>
          <div class="card-foot">
            <div class="price">฿${item.price}<small> บาท</small></div>
            ${!item.soldOut
              ?`<button class="add-btn${inCart?' in':''}" onclick='openOptions(${JSON.stringify(item.id)})'>${inCart?'✓':'+'}</button>`
              :'<span style="font-size:.68rem;color:var(--red)">หมด</span>'}
          </div>
        </div></div>`;
    });
    html += '</div>';
  });
  wrap.innerHTML = html || '<div class="state"><div class="ico">🍽️</div><div>ไม่มีเมนู</div></div>';
}

window.openOptions = function(itemId){
  const item = menuData[itemId];
  if(!item) return;
  pendingItem = {id:itemId, ...item};
  pendingSelections = {};

  // init defaults
  if(item.options){
    Object.entries(item.options).forEach(([gKey,g])=>{
      if(g.choices){
        const keys = Object.keys(g.choices);
        if(keys.length) pendingSelections[gKey] = keys[0];
      }
    });
  }

  renderOptionsModal();
  document.getElementById('optModal').classList.add('open');
};

function renderOptionsModal(){
  const item = pendingItem;
  let extra = 0;
  if(item.options){
    Object.entries(item.options).forEach(([gKey,g])=>{
      const sel = pendingSelections[gKey];
      if(sel && g.choices && g.choices[sel] && g.choices[sel].extra){
        extra += g.choices[sel].extra;
      }
    });
  }
  const totalPrice = item.price + extra;

  const img = item.image
    ? `<img class="modal-img" src="${item.image}">`
    : `<div class="modal-img-ph">${catEmoji[item.category]||'🍽️'}</div>`;

  let optsHtml = '';
  if(item.options){
    Object.entries(item.options).forEach(([gKey,g])=>{
      const sel = pendingSelections[gKey];
      optsHtml += `<div class="opt-group">
        <div class="opt-title">${g.label||gKey}${g.required?'<span class="opt-required">จำเป็น</span>':''}</div>
        <div class="opt-chips">`;
      if(g.choices){
        Object.entries(g.choices).forEach(([cKey,c])=>{
          const isObj = typeof c === 'object';
          const label = isObj ? c.label : c;
          const extra = isObj && c.extra ? c.extra : 0;
          optsHtml += `<div class="opt-chip${sel===cKey?' sel':''}" onclick="selectOpt('${gKey}','${cKey}')">
            ${label}${extra?`<span class="opt-extra">+${extra}</span>`:''}
          </div>`;
        });
      }
      optsHtml += `</div></div>`;
    });
  }

  document.getElementById('optModalBody').innerHTML = `
    ${img}
    <div class="modal-name">${item.name}</div>
    <div class="modal-desc">${item.desc||''}</div>
    <div class="modal-price">฿${totalPrice}</div>
    ${optsHtml}
    <div class="note-lbl" style="margin-top:4px;">หมายเหตุ</div>
    <textarea class="note-input" id="noteInput" rows="2" placeholder="หวานน้อย, ไม่ใส่น้ำแข็ง..."></textarea>
    <div class="note-sugs">
      <div class="note-sug" onclick="addSug('หวานน้อย')">หวานน้อย</div>
      <div class="note-sug" onclick="addSug('ไม่หวาน')">ไม่หวาน</div>
      <div class="note-sug" onclick="addSug('ไม่ใส่น้ำแข็ง')">ไม่ใส่น้ำแข็ง</div>
      <div class="note-sug" onclick="addSug('นมน้อย')">นมน้อย</div>
      <div class="note-sug" onclick="addSug('เพิ่มช็อต')">เพิ่มช็อต</div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOptModal()">ยกเลิก</button>
      <button class="btn-add" onclick="confirmAdd()">เพิ่มลงตะกร้า ฿${totalPrice}</button>
    </div>`;
};

window.selectOpt = function(gKey, cKey){
  pendingSelections[gKey] = cKey;
  renderOptionsModal();
  const note = document.getElementById('noteInput');
  if(note) note.value = '';
};

window.addSug = function(txt){
  const inp = document.getElementById('noteInput');
  if(inp) inp.value = inp.value ? inp.value+', '+txt : txt;
};

window.closeOptModal = function(){
  document.getElementById('optModal').classList.remove('open');
  pendingItem = null;
};

window.confirmAdd = function(){
  if(!pendingItem) return;
  const item = pendingItem;
  const note = (document.getElementById('noteInput')?.value||'').trim();

  // calc total
  let extra = 0;
  const optLabels = [];
  if(item.options){
    Object.entries(item.options).forEach(([gKey,g])=>{
      const sel = pendingSelections[gKey];
      if(sel && g.choices){
        const c = g.choices[sel];
        const isObj = typeof c==='object';
        const label = isObj?c.label:c;
        const ex = isObj&&c.extra?c.extra:0;
        extra += ex;
        optLabels.push(label+(ex?` +${ex}`:''));
      }
    });
  }
  const lineTotal = item.price + extra;

  cart.push({
    item,
    selectedOptions: {...pendingSelections},
    optLabels,
    note,
    lineTotal
  });

  updateCartBar();
  closeOptModal();
  renderMenu();
};

document.getElementById('optModal').addEventListener('click', e=>{
  if(e.target.id==='optModal') closeOptModal();
});
document.getElementById('cartModal').addEventListener('click', e=>{
  if(e.target.id==='cartModal') document.getElementById('cartModal').classList.remove('open');
});

function updateCartBar(){
  const count = cart.length;
  const total = cart.reduce((s,c)=>s+c.lineTotal,0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = total;
  document.getElementById('cartBar').classList.toggle('hidden', count===0);
}

window.openCart = function(){
  renderCartItems();
  document.getElementById('cartModal').classList.add('open');
};

function renderCartItems(){
  const total = cart.reduce((s,c)=>s+c.lineTotal,0);
  document.getElementById('sheetTotal').textContent = total;
  if(!cart.length){
    document.getElementById('cartItems').innerHTML='<div class="empty-cart">ยังไม่มีรายการ</div>';
    return;
  }
  document.getElementById('cartItems').innerHTML = cart.map((c,i)=>`
    <div class="ci">
      <div style="flex:1">
        <div class="ci-name">${c.item.name}</div>
        ${c.optLabels.length?`<div class="ci-opts">${c.optLabels.join(' · ')}</div>`:''}
        ${c.note?`<div class="ci-note">📝 ${c.note}</div>`:''}
        <div class="ci-price">฿${c.lineTotal}</div>
      </div>
      <div class="qty-row">
        <button class="qty-btn" onclick="removeCartItem(${i})">✕</button>
      </div>
    </div>`).join('');
}

window.removeCartItem = function(i){
  cart.splice(i,1);
  updateCartBar();
  renderCartItems();
  renderMenu();
};

window.placeOrder = async function(){
  if(!tableNo){alert('กรุณาสแกน QR Code ที่โต๊ะก่อนสั่งอาหารครับ');return;}
  if(validTables && !validTables.includes(String(tableNo))){
    alert('ไม่พบโต๊ะนี้ในระบบ กรุณาสแกน QR ใหม่ครับ'); return;
  }
  if(!cart.length){alert('ยังไม่มีรายการ');return;}
  const btn = document.querySelector('.place-btn');
  btn.textContent='กำลังส่ง...';btn.disabled=true;
  try{
    const items = cart.map(c=>{
      const opts = c.optLabels.join(', ');
      const note = c.note;
      let name = c.item.name;
      if(opts) name += ` (${opts})`;
      if(note) name += ` [${note}]`;
      return {name, price:c.lineTotal};
    });
    const total = cart.reduce((s,c)=>s+c.lineTotal,0);
    await push(ref(db,'orders'),{
      table: tableNo,
      items,
      total,
      status:'รอดำเนินการ',
      createdAt: serverTimestamp()
    });
    document.getElementById('cartModal').classList.remove('open');
    document.getElementById('successTable').textContent=`โต๊ะ ${tableNo}`;
    document.getElementById('successScreen').classList.add('show');
  }catch(e){alert('เกิดข้อผิดพลาด กรุณาลองใหม่ครับ\n'+e.message);}
  finally{btn.textContent='สั่งอาหาร →';btn.disabled=false;}
};

window.resetOrder = function(){
  cart=[];
  updateCartBar();
  document.getElementById('successScreen').classList.remove('show');
  // show order history button after first order
  if(tableOrders.length>0){
    document.getElementById('ordersBtn').classList.add('show');
  }
};
</script>
</body>
